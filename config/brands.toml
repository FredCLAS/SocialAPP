# Non-secret configuration. Secrets live in macOS Keychain only.
timezone = "America/New_York"
dry_run = true          # global default; --live is not available until M10

[canva]
# Canva Connect OAuth. Pamela creates the integration in her Canva developer account
# and pastes its client ID here. Endpoints below are from Canva's docs; verify before first use.
client_id = "REPLACE_WITH_CANVA_CLIENT_ID"
authorize_url = "https://www.canva.com/api/oauth/authorize"
token_url = "https://api.canva.com/rest/v1/oauth/token"
redirect_port = 8765
scopes = ["design:content:read", "design:content:write", "design:meta:read", "asset:write", "brandtemplate:meta:read", "brandtemplate:content:read", "folder:read"]

[meta]
api_version = "v21.0"   # Graph API version; verify current before go-live

[media]
# Instagram and Facebook fetch media from a public URL. Hosting decision pending (see open questions).
public_base_url = ""

[llm]
model = "claude-haiku-5-5"   # caption drafting; key lives in Keychain as socialops.claude / api_key
max_tokens = 800
max_drafts_per_run = 25

[footer]
company = "CLAS by Fred"
postal_address = "6271 St Augustine Rd Ste 24, Jacksonville, FL 32217, US"

[brands.clas_by_fred]
display_name = "CLAS by Fred"
website = "https://classbyfred.com"
outreach_sender = "fred@clasbyfred.com"   # cold email only; Microsoft 365 on clasbyfred.com (confirm domain is owned)
assets_subdir = "clas_by_fred"

  [brands.clas_by_fred.platforms.facebook]
  account_id = "REPLACE_CLAS_FB_PAGE_ID"
  per_week = 7
  video_per_week = 3
  days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
  post_time = "08:30"
  mix = { image_checklist = 4, question = 2, webinar_cta = 1 }

  [brands.clas_by_fred.platforms.instagram]
  account_id = "REPLACE_CLAS_IG_BUSINESS_ID"
  per_week = 7
  video_per_week = 3
  days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
  post_time = "08:30"
  mix = { image_checklist = 4, question = 2, webinar_cta = 1 }

  [brands.clas_by_fred.platforms.linkedin]
  per_week = 3
  video_per_week = 0
  days = ["tue", "wed", "thu"]
  post_time = "10:00"
  manual_post = true
  mix = { standard = 3 }

  [brands.clas_by_fred.platforms.youtube]
  per_week = 0            # replay per webinar, not weekly
  video_per_week = 0
  days = []
  post_time = "10:00"
  upload_deadline_hours = 48

