# Non-secret configuration. Secrets live in macOS Keychain only.
timezone = "America/New_York"
dry_run = true          # global default; --live is not available until M10

[llm]
model = "claude-sonnet-5-5"   # caption drafting; key lives in Keychain as socialops.claude / api_key
max_tokens = 800
max_drafts_per_run = 25

[footer]
company = "CLAS by Fred"
postal_address = "6271 St Augustine Rd Ste 24, Jacksonville, FL 32217, US"

[brands.clas_by_fred]
display_name = "CLAS by Fred"
website = "https://classbyfred.com"
outreach_sender = "fred@classbyfred.com"   # cold email only; Microsoft 365 on classbyfred.com
assets_subdir = "clas_by_fred"

  [brands.clas_by_fred.platforms.facebook]
  per_week = 7
  video_per_week = 3
  days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
  post_time = "08:30"
  mix = { image_checklist = 4, question = 2, webinar_cta = 1 }

  [brands.clas_by_fred.platforms.instagram]
  per_week = 7
  video_per_week = 3
  days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
  post_time = "08:30"
  mix = { image_checklist = 4, question = 2, webinar_cta = 1 }

  [brands.clas_by_fred.platforms.linkedin]
  per_week = 3
  video_per_week = 0
  days = ["tue", "wed", "thu"]
  post_time = "10:00"
  manual_post = true
  mix = { standard = 3 }

  [brands.clas_by_fred.platforms.youtube]
  per_week = 0            # replay per webinar, not weekly
  video_per_week = 0
  days = []
  post_time = "10:00"
  upload_deadline_hours = 48

[brands.pamela_art]
display_name = "Pamela Patton"
website = "https://pamelapatton.art"
assets_subdir = "pamela_art"

  [brands.pamela_art.platforms.facebook]
  per_week = 4
  video_per_week = 0
  days = ["mon", "wed", "fri", "sun"]
  post_time = "08:30"
  mix = { art = 4 }

  [brands.pamela_art.platforms.instagram]
  per_week = 4
